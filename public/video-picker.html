<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Homepage video picker — Madeirabook</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      background: #0a1420;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      padding: 32px 20px 80px;
    }
    h1 {
      font-weight: 300;
      font-size: 28px;
      text-align: center;
      margin-bottom: 6px;
    }
    .sub {
      text-align: center;
      color: rgba(255,255,255,.55);
      font-size: 14px;
      margin-bottom: 24px;
    }
    .picks {
      max-width: 1100px;
      margin: 0 auto 28px;
      padding: 14px 18px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 12px;
      background: rgba(255,255,255,.04);
      font-size: 13px;
      line-height: 1.7;
      color: rgba(255,255,255,.8);
      word-break: break-all;
    }
    .picks b { color: #34d399; }
    .grid {
      max-width: 1100px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }
    .card {
      border: 1px solid rgba(255,255,255,.1);
      border-radius: 14px;
      overflow: hidden;
      background: rgba(255,255,255,.03);
    }
    .card video {
      display: block;
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: #000;
    }
    .meta { padding: 12px 14px 14px; }
    .badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      padding: 3px 8px;
      border-radius: 999px;
      margin-bottom: 8px;
    }
    .badge.mountains { background: rgba(148,163,184,.2); color: #cbd5e1; }
    .badge.forest    { background: rgba(52,211,153,.18); color: #6ee7b7; }
    .badge.ocean     { background: rgba(56,189,248,.18); color: #7dd3fc; }
    .badge.hero      { background: rgba(251,191,36,.18); color: #fcd34d; }
    .title { font-size: 14px; color: rgba(255,255,255,.85); margin-bottom: 4px; }
    .url {
      font-size: 11px;
      color: rgba(255,255,255,.4);
      word-break: break-all;
      margin-bottom: 10px;
    }
    .btns { display: flex; flex-wrap: wrap; gap: 6px; }
    .btns button {
      font-size: 11px;
      font-weight: 600;
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.2);
      background: transparent;
      color: rgba(255,255,255,.8);
      cursor: pointer;
      transition: background .15s, border-color .15s;
    }
    .btns button:hover { background: rgba(255,255,255,.1); }
    .btns button.picked {
      background: #059669;
      border-color: #059669;
      color: #fff;
    }
    .note {
      max-width: 1100px;
      margin: 24px auto 0;
      font-size: 12px;
      color: rgba(255,255,255,.4);
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>Homepage video picker</h1>
  <p class="sub">Click a slot button on any card to choose it. The picked URL is copied to your clipboard and logged to the console.</p>

  <div class="picks" id="picks"><b>Picks:</b> none yet</div>

  <div class="grid" id="grid"></div>

  <p class="note">hero-forest is uploaded to R2 but has no DB row — mark it wherever you want it used.</p>

  <script>
    const R2 = 'https://pub-f74fa992eaf9435c83af63e8d0b4fc51.r2.dev';

    const VIDEOS = [
      { category: 'hero',      title: 'Hero forest loop (not in DB)',                    file: 'homepage-hero-forest',        poster: 'homepage-hero-forest-poster.jpg' },
      { category: 'mountains', title: 'Aerial above the clouds on the ridge',            file: 'homepage-video-mountains-1' },
      { category: 'mountains', title: 'Peak emerging from a sea of clouds',              file: 'homepage-video-mountains-2' },
      { category: 'mountains', title: 'Drone over cloud-filled valley at dusk',          file: 'homepage-video-mountains-3' },
      { category: 'forest',    title: 'Levada path through the green hillside',          file: 'homepage-video-forest-1' },
      { category: 'forest',    title: 'Laurel forest trail with ferns',                  file: 'homepage-video-forest-2' },
      { category: 'forest',    title: 'Mossy stream in the woods',                       file: 'homepage-video-forest-3' },
      { category: 'ocean',     title: 'Waves breaking on the lava cliff edge',           file: 'homepage-video-ocean-1' },
      { category: 'ocean',     title: 'Coastal cliff glowing at sunset',                 file: 'homepage-video-ocean-2' },
      { category: 'ocean',     title: 'Green headland and surf from above',              file: 'homepage-video-ocean-3' },
    ];

    const SLOTS = ['hero', 'mountains', 'forest', 'ocean'];
    const picks = {};

    const grid = document.getElementById('grid');
    const picksEl = document.getElementById('picks');

    function renderPicks() {
      const parts = SLOTS
        .filter((s) => picks[s])
        .map((s) => `${s}: ${picks[s]}`);
      picksEl.innerHTML = parts.length
        ? '<b>Picks:</b><br>' + parts.join('<br>')
        : '<b>Picks:</b> none yet';
    }

    function pick(slot, video, btn) {
      const url = `${R2}/${video.file}.mp4`;
      picks[slot] = url;
      console.log(`[pick] ${slot} -> ${url}`);
      if (navigator.clipboard) navigator.clipboard.writeText(url).catch(() => {});
      document
        .querySelectorAll(`button[data-slot="${slot}"]`)
        .forEach((b) => b.classList.remove('picked'));
      btn.classList.add('picked');
      renderPicks();
    }

    for (const v of VIDEOS) {
      const videoUrl = `${R2}/${v.file}.mp4`;
      const posterUrl = v.poster ? `${R2}/${v.poster}` : `${R2}/${v.file}-poster.jpg`;

      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <video src="${videoUrl}" poster="${posterUrl}"
               muted loop playsinline autoplay controls preload="metadata"></video>
        <div class="meta">
          <span class="badge ${v.category}">${v.category}</span>
          <div class="title">${v.title}</div>
          <div class="url">${videoUrl}</div>
          <div class="btns">
            ${SLOTS.map(
              (s) => `<button data-slot="${s}">Use as ${s}</button>`,
            ).join('')}
          </div>
        </div>`;

      card.querySelectorAll('button').forEach((btn) => {
        btn.addEventListener('click', () => pick(btn.dataset.slot, v, btn));
      });

      // Avoid 10 videos racing for bandwidth at once: pause when off-screen.
      const vid = card.querySelector('video');
      new IntersectionObserver(
        (entries) => {
          entries.forEach((e) => {
            if (e.isIntersecting) vid.play().catch(() => {});
            else vid.pause();
          });
        },
        { threshold: 0.25 },
      ).observe(vid);

      grid.appendChild(card);
    }
  </script>
<script src="/cookie-consent.js" defer></script>
</body>
</html>
